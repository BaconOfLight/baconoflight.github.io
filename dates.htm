<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Calendar Study - DEBUG MODE</title>
    <link rel="stylesheet" href="dates.css">
    <style>
        #debug-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 2px solid #0f0;
            z-index: 9999;
        }
        #debug-panel h3 {
            margin: 0 0 10px 0;
            color: #fff;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px;
        }
        .log-error { color: #f66; }
        .log-warn { color: #ff0; }
        .log-success { color: #6f6; }
        .log-info { color: #6ff; }
        #test-buttons {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
        }
        #test-buttons button {
            display: block;
            margin: 5px 0;
            padding: 8px 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="test-buttons">
        <h4 style="color:#fff;margin:0 0 10px 0;">TTS Tests</h4>
        <button onclick="testEnglish()">Test English</button>
        <button onclick="testJapanese()">Test Japanese</button>
        <button onclick="testVoices()">List Voices</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="container">
        <div class="top-bar">
            <select id="year-select"></select>
            <select id="month-select"></select>
            <select id="day-select"></select>
        </div>

        <div class="calendar">
            <div class="action-row">
                <button class="action-btn" id="year-btn" onclick="playYearSound()">2026 年</button>
                <button class="action-btn" id="month-btn" onclick="playMonthSound()">1 月</button>
                <button class="action-btn" id="day-btn" onclick="playDaySoundSelected()">15 日</button>
                <button class="action-btn" id="date-btn" onclick="playFullDate()">年月日</button>
            </div>

            <div class="day-headers" id="day-headers"></div>
            <div class="calendar-grid" id="calendar-grid"></div>
            <div class="action-row">
                <button class="action-btn" id="week-btn" onclick="toggleWeek()">週</button>
            </div>
        </div>

        <div class="footer">
            <label>Voice: <select id="voice-select"></select></label>
        </div>
    </div>

    <div id="debug-panel">
        <h3>🔍 Debug Log</h3>
        <div id="log-content"></div>
    </div>

    <script>
        // Debug logging
        function log(message, type = 'info') {
            const logContent = document.getElementById('log-content');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logContent.insertBefore(entry, logContent.firstChild);
            console.log(`[TTS DEBUG ${type.toUpperCase()}] ${message}`);
        }

        function clearLog() {
            document.getElementById('log-content').innerHTML = '';
            log('Log cleared', 'info');
        }

        const daysOfWeek = [
            { kanji: '日', name: 'Sunday' },
            { kanji: '月', name: 'Monday' },
            { kanji: '火', name: 'Tuesday' },
            { kanji: '水', name: 'Wednesday' },
            { kanji: '木', name: 'Thursday' },
            { kanji: '金', name: 'Friday' },
            { kanji: '土', name: 'Saturday' }
        ];

        const months = ['January', 'February', 'March', 'April', 'May', 'June',
                        'July', 'August', 'September', 'October', 'November', 'December'];

        const monthsJapanese = ['一月', '二月', '三月', '四月', '五月', '六月', 
                                '七月', '八月', '九月', '十月', '十一月', '十二月'];

        const daysReadings = [
            null, '一日', '二日', '三日', '四日', '五日', '六日', '七日', '八日', '九日', '十日',
            '十一日', '十二日', '十三日', '十四日', '十五日', '十六日', '十七日', '十八日', '十九日', '二十日',
            '二十一日', '二十二日', '二十三日', '二十四日', '二十五日', '二十六日', '二十七日', '二十八日', '二十九日', '三十日',
            '三十一日'
        ];

        let selectedDay = new Date().getDate();
        let showWeek = false;
        let selectedVoice = null;
        let voicesLoaded = false;
        let yearSelect, monthSelect, daySelect;

        function sanitizeText(text) {
            if (typeof text !== 'string') return '';
            return text.replace(/</g, '\uff1c').replace(/>/g, '\uff1e');
        }

        // Initialize selectors
        function initSelectors() {
            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth();

            yearSelect = document.getElementById('year-select');
            for (let year = 1900; year <= 2030; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === currentYear) option.selected = true;
                yearSelect.appendChild(option);
            }

            monthSelect = document.getElementById('month-select');
            months.forEach((month, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = month;
                if (index === currentMonth) option.selected = true;
                monthSelect.appendChild(option);
            });

            daySelect = document.getElementById('day-select');
            for (let day = 1; day <= 31; day++) {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day;
                if (day === selectedDay) option.selected = true;
                daySelect.appendChild(option);
            }

            document.getElementById('day-btn').textContent = selectedDay + '日';
        }

        function renderDayHeaders() {
            const container = document.getElementById('day-headers');
            container.innerHTML = daysOfWeek.map((day, index) => `
                <div class="day-header ${index === 0 ? 'sunday' : index === 6 ? 'saturday' : ''}" 
                     onclick="playDaySound('${day.name}')">
                    <div class="kanji">${day.kanji}</div>
                </div>
            `).join('');
        }

        function getWeekRange(date) {
            const day = date.getDay();
            const diff = date.getDate() - day;
            const startOfWeek = new Date(date.setDate(diff));
            const endOfWeek = new Date(date.setDate(diff + 6));
            return { start: startOfWeek, end: endOfWeek };
        }

        function renderCalendar() {
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);
            const selected = parseInt(daySelect.value);

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            let weekStart = null, weekEnd = null;
            if (showWeek && selected <= daysInMonth) {
                const selectedDate = new Date(year, month, selected);
                const weekRange = getWeekRange(selectedDate);
                weekStart = weekRange.start;
                weekEnd = weekRange.end;
            }

            const container = document.getElementById('calendar-grid');
            let html = '';

            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day empty"></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dayOfWeek = date.getDay();

                let classes = 'calendar-day';
                if (dayOfWeek === 0) classes += ' sunday';
                if (dayOfWeek === 6) classes += ' saturday';
                if (isCurrentMonth && day === today.getDate()) classes += ' today';
                if (day === selected) classes += ' selected';
                if (showWeek && weekStart && weekEnd && date >= weekStart && date <= weekEnd) {
                    classes += ' week-highlight';
                }

                html += `<div class="${classes}" onclick="selectDay(${day})">${day}</div>`;
            }

            container.innerHTML = html;
            document.getElementById('month-btn').textContent = `${month + 1} 月`;
            document.getElementById('year-btn').textContent = year + '年';
        }

        function selectDay(day) {
            selectedDay = day;
            daySelect.value = day;
            document.getElementById('day-btn').textContent = day + '日';
            playDayReading(day);
            renderCalendar();
        }

        function toggleWeek() {
            showWeek = !showWeek;
            document.getElementById('week-btn').classList.toggle('active', showWeek);
            renderCalendar();
        }

        function speakJapanese(text, label = 'unknown') {
            log(`speakJapanese called: "${text}" (${label})`, 'info');
            
            // Check API availability
            if (!('speechSynthesis' in window)) {
                log('❌ speechSynthesis API NOT available', 'error');
                alert('Speech Synthesis API is not available in this browser');
                return;
            }
            
            log('✓ speechSynthesis API is available', 'success');

            // Sanitize text
            const sanitizedText = sanitizeText(text);
            log(`Sanitized text: "${sanitizedText}"`, 'info');
            
            if (!sanitizedText.trim()) {
                log('⚠ Empty text after sanitization', 'warn');
                return;
            }

            // Check if speaking is possible
            log(`speechSynthesis.speaking: ${speechSynthesis.speaking}`, 'info');
            log(`speechSynthesis.pending: ${speechSynthesis.pending}`, 'info');

            try {
                // Cancel any ongoing speech
                log('Calling speechSynthesis.cancel()...', 'info');
                speechSynthesis.cancel();
                
                setTimeout(() => {
                    try {
                        const utterance = new SpeechSynthesisUtterance(sanitizedText);
                        log(`Created utterance for: "${sanitizedText}"`, 'success');
                        
                        utterance.lang = 'ja-JP';
                        utterance.rate = 0.8;
                        utterance.pitch = 1.0;
                        
                        log(`Selected voice: ${selectedVoice ? selectedVoice.name : 'Default'}`, 'info');
                        if (selectedVoice) {
                            utterance.voice = selectedVoice;
                        }

                        utterance.onerror = (event) => {
                            log(`❌ Utterance error: ${event.error}`, 'error');
                            log(`Error details: ${JSON.stringify(event)}`, 'error');
                        };

                        utterance.onend = () => {
                            log(`✓ Utterance completed successfully`, 'success');
                        };
                        
                        utterance.onstart = () => {
                            log(`✓ Utterance started playing`, 'success');
                        };

                        log('Calling speechSynthesis.speak()...', 'info');
                        speechSynthesis.speak(utterance);
                        log(`✓ speak() called, pending: ${speechSynthesis.pending}`, 'success');
                        
                    } catch (e) {
                        log(`❌ Failed to create/speak utterance: ${e.message}`, 'error');
                        log(`Stack: ${e.stack}`, 'error');
                    }
                }, 10);
            } catch (e) {
                log(`❌ Speech synthesis failed: ${e.message}`, 'error');
            }
        }

        function playDaySound(dayName) {
            const sounds = {
                'Sunday': '日曜日', 'Monday': '月曜日', 'Tuesday': '火曜日',
                'Wednesday': '水曜日', 'Thursday': '木曜日', 'Friday': '金曜日', 'Saturday': '土曜日'
            };
            speakJapanese(sounds[dayName], `day-${dayName}`);
        }

        function playMonthSound() {
            speakJapanese(monthsJapanese[parseInt(monthSelect.value)], 'month');
        }

        function playDayReading(day) {
            if (daysReadings[day]) {
                speakJapanese(daysReadings[day], `day-reading-${day}`);
            } else {
                log(`No reading for day ${day}`, 'warn');
            }
        }

        function initVoices() {
            if (voicesLoaded) {
                log('Voices already loaded, skipping', 'info');
                return;
            }
            
            log('initVoices() called', 'info');
            
            const voiceSelect = document.getElementById('voice-select');
            const voices = speechSynthesis.getVoices();
            
            log(`getVoices() returned ${voices.length} voices`, 'info');
            
            if (voices.length === 0) {
                log('⚠ No voices returned yet - may need to wait', 'warn');
            }
            
            voiceSelect.innerHTML = '';
            
            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = 'Default';
            voiceSelect.appendChild(defaultOpt);

            const jpVoices = voices.filter(v => {
                const isJP = v.lang.includes('ja');
                log(`Voice: "${v.name}" lang="${v.lang}" ${isJP ? '✓ JP' : ''}`, isJP ? 'success' : 'info');
                return isJP;
            });
            
            log(`Found ${jpVoices.length} Japanese voices`, 'success');
            
            jpVoices.forEach(voice => {
                const opt = document.createElement('option');
                opt.value = voice.name;
                opt.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(opt);
            });

            voiceSelect.addEventListener('change', () => {
                selectedVoice = voices.find(v => v.name === voiceSelect.value) || null;
                log(`Voice changed to: ${selectedVoice ? selectedVoice.name : 'Default'}`, 'info');
            });

            voicesLoaded = true;
            log('Voice initialization complete', 'success');
        }

        function getYearReading(year) {
            const thousands = Math.floor(year / 1000);
            const hundreds = Math.floor((year % 1000) / 100);
            const tens = Math.floor((year % 100) / 10);
            const ones = year % 10;

            let reading = '';

            if (thousands === 1) reading += 'せん';
            else if (thousands > 1) reading += ['','いち','に','さん','よ','ご','ろく','なな','はち','きゅう'][thousands] + 'せん';

            if (hundreds > 0) {
                reading += ['','ひゃく','にひゃく','さんびゃく','よんひゃく','ごひゃく','ろっぴゃく','ななひゃく','はっぴゃく','きゅうひゃく'][hundreds];
            }

            if (tens > 0) {
                reading += ['','じゅう','にじゅう','さんじゅう','よんじゅう','ごじゅう','ろくじゅう','ななじゅう','はちじゅう','きゅうじゅう'][tens];
            }

            if (ones > 0) {
                reading += ['','いち','に','さん','よ','ご','ろく','なな','はち','きゅう'][ones];
            }

            return reading + 'ねん';
        }

        function playYearSound() {
            speakJapanese(getYearReading(parseInt(yearSelect.value)), 'year');
        }

        function playFullDate() {
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value) + 1;
            const day = parseInt(daySelect.value);
            speakJapanese(getYearReading(year) + ' ' + monthsJapanese[month - 1] + daysReadings[day], 'full-date');
        }

        function playDaySoundSelected() {
            playDayReading(parseInt(daySelect.value));
        }

        // Test functions
        function testEnglish() {
            log('=== ENGLISH TEST ===', 'info');
            if (!('speechSynthesis' in window)) {
                log('❌ speechSynthesis not available', 'error');
                return;
            }
            
            const utterance = new SpeechSynthesisUtterance('Hello, this is a test');
            utterance.lang = 'en-US';
            utterance.onerror = (e) => log(`English test error: ${e.error}`, 'error');
            utterance.onend = () => log('English test completed', 'success');
            speechSynthesis.speak(utterance);
            log('English test initiated', 'info');
        }

        function testJapanese() {
            log('=== JAPANESE TEST ===', 'info');
            speakJapanese('こんにちは', 'manual-test');
        }

        function testVoices() {
            log('=== VOICE LIST TEST ===', 'info');
            const voices = speechSynthesis.getVoices();
            log(`Total voices: ${voices.length}`, 'info');
            voices.forEach((v, i) => {
                log(`[${i}] ${v.name} - ${v.lang} - ${v.default ? 'DEFAULT' : ''}`, 'info');
            });
        }

        function initEventListeners() {
            yearSelect.addEventListener('change', () => {
                document.getElementById('year-btn').textContent = yearSelect.value + '年';
                renderCalendar();
            });

            monthSelect.addEventListener('change', () => {
                const year = parseInt(yearSelect.value);
                const month = parseInt(monthSelect.value);
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                if (selectedDay > daysInMonth) {
                    selectedDay = daysInMonth;
                    daySelect.value = selectedDay;
                }
                renderCalendar();
            });

            daySelect.addEventListener('change', () => {
                selectedDay = parseInt(daySelect.value);
                renderCalendar();
            });

            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => {
                    log('voiceschanged event fired', 'info');
                    initVoices();
                };
            } else {
                log('voiceschanged event not supported', 'warn');
            }
            
            setTimeout(() => {
                log('Initial voice load attempt...', 'info');
                initVoices();
            }, 100);
        }

        // Initialize
        log('Page loaded, starting initialization...', 'info');
        initSelectors();
        renderDayHeaders();
        renderCalendar();
        initEventListeners();
        log('Initialization complete', 'success');
    </script>
</body>
</html>
